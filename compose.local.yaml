# LOCAL DEVELOPMENT ONLY. Ports bind to loopback, never the LAN.
# Synthetic credentials are unrelated to any account or deployment.
name: cookbook-local
services:
  database:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: cookbook_local
      POSTGRES_PASSWORD: cookbook-local-development-only
      POSTGRES_DB: cookbook_dev
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - development-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook_local -d cookbook_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"
  verification:
    image: postgres:16.15-bookworm
    profiles: ["verification"]
    environment:
      POSTGRES_USER: cookbook_tests
      POSTGRES_PASSWORD: cookbook-disposable-tests-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    # Ephemeral cluster. NEVER put development data here.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook_tests -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"
volumes:
  development-data:
