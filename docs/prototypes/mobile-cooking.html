<style>

*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,a,select,input{touch-action:manipulation}button,select{cursor:pointer}button{color:inherit}button:disabled{cursor:default;opacity:.55}a{color:var(--blue)}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}h1,h2,h3,p{margin:0}h1{font-size:clamp(26px,4vw,38px);line-height:1.2;letter-spacing:-1px;text-wrap:balance}h2{font-size:20px;letter-spacing:-.4px}h3{font-size:17px;line-height:1.45}p{line-height:1.65}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:11px 15px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px;font-weight:600;text-decoration:none}.primary{background:var(--blue);color:var(--onblue);border-color:var(--blue)}.quiet{background:transparent;border:0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.wrap{max-width:1040px;margin:auto;padding:0 20px}header.brand{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}.brand strong{font-size:16px;letter-spacing:-.5px}.brand .button{min-height:40px;padding:8px 10px}.preview-tools{font-size:11px;background:var(--soft);padding:7px 20px;color:var(--blue)}.preview-tools summary{cursor:pointer}.preview-tools .row{justify-content:start;padding:12px 0}.preview-tools label{display:grid;gap:5px}.preview-tools select{max-width:180px;min-height:40px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px;font-size:13px}.skip{position:absolute;left:12px;top:-100px;z-index:100;background:var(--surface);padding:12px}.skip:focus{top:12px}
.hero{padding-top:25px;padding-bottom:24px}.hero h1{margin:8px 0 12px;max-width:690px}.hero .meta{font-size:13px;color:var(--muted)}.version{display:flex;align-items:center;gap:12px;margin-top:20px}.version label{font-size:12px;color:var(--muted)}.version select{min-height:44px;border:1px solid var(--line);padding:8px 12px;border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px;max-width:100%}.sticky-tabs{position:sticky;top:0;z-index:20;background:var(--surface);border-block:1px solid var(--line)}.sticky-context{display:flex;justify-content:space-between;gap:8px;padding-top:10px;font-size:11px;color:var(--muted)}.tabs{display:flex;gap:24px}.tabs button{border:0;border-bottom:3px solid transparent;background:none;padding:14px 0 11px;min-height:48px;color:var(--muted);font-weight:600;font-size:14px}.tabs button[aria-selected=true]{color:var(--blue);border-color:var(--blue)}main{padding-bottom:125px}.sections{padding-top:24px}.section{min-width:0;scroll-margin-top:110px}.section[hidden]{display:none}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.servings{display:flex;gap:10px;align-items:center;font-size:13px}.servings button{padding:0;width:40px;min-height:40px}.ingredients{padding:0;margin:0;list-style:none}.ingredients li{border-bottom:1px solid var(--line)}.ingredients label{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 0;line-height:1.45;cursor:pointer}.ingredients input{width:19px;height:19px;accent-color:var(--blue);flex-shrink:0}.ingredients input:checked+span{text-decoration:line-through;color:var(--muted)}.ingredients .qty{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:13px}.note{background:var(--soft);border-left:3px solid var(--blue);padding:16px 18px;margin:22px 0}.note h3{font-size:14px;color:var(--blue)}.note p{font-size:14px;margin-top:6px}.method{list-style:none;margin:0;padding:0;counter-reset:step}.method>li{counter-increment:step;display:flex;gap:15px;border-bottom:1px solid var(--line);padding:20px 0;scroll-margin-top:110px}.method>li:before{content:counter(step,decimal-leading-zero);font-size:12px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}.method p{font-size:15px;margin-top:8px}.method h3{font-size:18px}.footnote{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.6}.actions{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px max(12px,env(safe-area-inset-bottom))}.actions .wrap{padding:0;display:flex;gap:10px}.actions .button{flex:1}.notice{padding:25px 0}.notice h2{margin-bottom:12px}.notice .button{margin-top:18px}.error{color:var(--danger)}.cookbar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);z-index:20;padding:12px 0}.cookbar .small{max-width:55%;line-height:1.5}.cook-layout{padding-top:26px;display:grid;gap:28px}.cookstep{min-width:0}.cookstep h1{font-size:32px;margin:16px 0 22px}.instruction{font-size:20px;line-height:1.75}.progress{height:3px;display:flex;gap:5px;margin:0 0 30px}.progress span{flex:1;background:var(--line)}.progress .done{background:var(--blue)}.timer{font-variant-numeric:tabular-nums;margin:20px 0 0;color:var(--blue);background:var(--soft);border-color:var(--soft)}.timer.done{background:var(--attention);color:var(--onattention)}.help{border-block:1px solid var(--line);margin-top:24px;padding:15px 0}.help summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14px;min-height:30px;padding-top:5px}.help p{margin-top:15px;font-size:15px}.wide-ingredients{display:none}.cookstep .note{margin-top:24px}dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:0;border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:85dvh;margin:auto auto 0;overflow:auto}dialog::backdrop{background:#0009}.dialog-head{position:sticky;top:0;background:var(--surface);padding:16px 20px;border-bottom:1px solid var(--line);z-index:2}.dialog-body{padding:0 20px 24px}.dialog-head .small{margin-top:4px;color:var(--muted)}.dialog-head h2{font-size:19px}dialog .timer{margin-top:10px;width:100%}.toast{font-size:13px;color:var(--blue);padding:12px 20px;background:var(--soft);position:fixed;bottom:90px;left:20px;right:20px;max-width:700px;margin:auto;z-index:40}.toast:empty{display:none}
@media(min-width:900px){.wrap{padding-inline:32px}.hero{padding-top:32px}.sticky-tabs{display:none}.sections{display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,1.7fr);gap:56px;padding-top:10px}.section[hidden]{display:block}.cook-layout{grid-template-columns:minmax(260px,1fr) minmax(0,1.5fr);gap:64px;padding-top:45px}.wide-ingredients{display:block}.cookbar [data-action=ingredients]{display:none}.cookstep h1{font-size:38px}.actions .wrap{justify-content:flex-end}.actions .button{flex:0 1 240px}.actions{padding-block:16px}.cookstep .instruction{font-size:21px}dialog{margin:auto;border-radius:10px}.toast{bottom:94px}}
.brand .wrap{padding:0}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<details class="preview-tools"><summary>Design preview · sample content · controls</summary><div class="row"><label>Screen<select id="screen"><option value="recipe">Recipe</option><option value="cook">Cooking</option></select></label><label>Language<select id="language"><option value="en">English</option><option value="de">Deutsch</option></select></label><label>Appearance<select id="appearance"><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Preview state<select id="scenario"><option value="ready">Ready</option><option value="loading">Loading</option><option value="error">Error / retry</option><option value="locked">Locked tier</option></select></label></div></details>

<div id="app"></div><div id="message" class="toast" role="status"></div>
<dialog id="ingredient-dialog" aria-labelledby="dialog-title"><div class="dialog-head"><div class="row"><h2 id="dialog-title"></h2><button class="button quiet" data-action="close-dialog" id="close-dialog"></button></div><p class="small" id="dialog-context"></p><button class="button timer" data-action="timer" id="dialog-timer"></button></div><div class="dialog-body" id="dialog-ingredients"></div></dialog>
<script>
(()=>{
const $=s=>document.querySelector(s),app=$('#app'),mq=matchMedia('(min-width:900px)');
const params=new URLSearchParams(location.search);
const state={screen:params.get('screen')==='cook'?'cook':'recipe',language:params.get('lang')==='de'?'de':'en',theme:params.get('theme')==='dark'?'dark':'light',scenario:['error','loading','locked'].includes(params.get('state'))?params.get('state'):'ready',tab:'ingredients',servings:2,step:1,checks:new Set(),positions:{ingredients:0,method:0},remaining:300,deadline:null,timerStarted:false};
const copy={en:{title:'Lentil Bolognese with Spaghetti',short:'Lentil Bolognese',ingredients:'Ingredients',method:'Method',basic:'Basic',advanced:'Advanced · premium',version:'Version',servings:'servings',intro:'Italian · ~25 min',cook:'Start cooking',recipe:'Recipe overview',previewCook:'Cooking preview',previewRecipe:'Recipe preview',groceries:'Add to groceries',previous:'Previous',next:'Next step',finish:'Finish preview',close:'Close',sample:'Layout example only. Quantities and method below are illustrative, not an approved recipe.',equipment:'Before you begin',equipmentText:'Check the full method and equipment before turning on the heat. The production recipe’s equipment wording still needs culinary review.',help:'I’d like a little more help',cue:'What to look for',timer:'Start 5-minute timer',pause:'Pause',resume:'Resume',done:'Timer finished',step:'STEP',of:'OF',retry:'Try again',loading:'Loading your recipe…',loadHint:'Your place will stay here while the recipe loads.',simulate:'Finish simulated loading',error:'The recipe could not be loaded',errorHint:'Check your connection and try again. Your cooking attempt has not been restarted.',locked:'This version needs premium access',lockedHint:'Ingredients remain available in the real app. The complete method and cooking access require the appropriate account.',unlock:'Use Basic preview',saved:'Preview only — no grocery list was changed.',completed:'Cooking preview complete',completeHint:'The real app offers an optional reflection here. No cook or reflection was saved.',return:'Back to recipe',viewTimer:'Timer continues while you check ingredients.',amount:'Approximate values in this prototype',prep:'Prepare',look:['Ingredients ready before heating.','Small bubbles breaking the surface, rather than a vigorous rolling boil.','Check the authored doneness cues in the complete recipe.'],names:['Spaghetti','Cooked lentils','Chopped tomatoes','Onion','Carrot','Garlic','Olive oil','Dried oregano','Salt','Black pepper'],steps:[['Get everything ready','Read the method and collect your ingredients. Prepare the vegetables and keep everything within reach.','Take a moment to check the equipment and the order of the steps.'],['Find a gentle simmer','Lower the heat until small bubbles gently break the surface of the sauce. Stir occasionally.','If the sauce bubbles vigorously, lower the heat a little and give it time to respond before adjusting again.'],['Check the sauce','Stir and observe the texture before moving on. Use the complete recipe’s doneness cues to decide when it is ready.','A timer is a reminder to check the food, not proof that it is done.']]},de:{title:'Linsenbolognese mit Spaghetti',short:'Linsenbolognese',ingredients:'Zutaten',method:'Zubereitung',basic:'Einfach',advanced:'Fortgeschritten · Premium',version:'Variante',servings:'Portionen',intro:'Italienisch · ca. 25 Min.',cook:'Kochen starten',recipe:'Rezeptübersicht',previewCook:'Kochansicht testen',previewRecipe:'Rezept ansehen',groceries:'Zur Einkaufsliste',previous:'Zurück',next:'Nächster Schritt',finish:'Vorschau beenden',close:'Schließen',sample:'Nur ein Layoutbeispiel. Mengen und Zubereitung sind Beispiele, kein freigegebenes Rezept.',equipment:'Bevor du anfängst',equipmentText:'Lies die Zubereitung und prüfe die benötigten Utensilien, bevor du den Herd einschaltest. Die Angaben zur Topfnutzung im eigentlichen Rezept müssen noch geprüft werden.',help:'Ich möchte etwas mehr Hilfe',cue:'Worauf du achten kannst',timer:'5-Minuten-Timer starten',pause:'Pausieren',resume:'Fortsetzen',done:'Timer abgelaufen',step:'SCHRITT',of:'VON',retry:'Erneut versuchen',loading:'Dein Rezept wird geladen…',loadHint:'Deine aktuelle Stelle bleibt erhalten, während das Rezept geladen wird.',simulate:'Simulierten Ladevorgang beenden',error:'Das Rezept konnte nicht geladen werden',errorHint:'Prüfe deine Verbindung und versuche es erneut. Dein Kochversuch wurde nicht neu gestartet.',locked:'Für diese Variante brauchst du Premium',lockedHint:'Die Zutaten bleiben in der richtigen App sichtbar. Die vollständige Zubereitung und der Kochmodus benötigen den entsprechenden Zugang.',unlock:'Einfache Variante ansehen',saved:'Nur Vorschau — die Einkaufsliste wurde nicht geändert.',completed:'Kochvorschau beendet',completeHint:'Die richtige App bietet hier eine freiwillige Reflexion an. Es wurde kein Kochversuch gespeichert.',return:'Zurück zum Rezept',viewTimer:'Der Timer läuft weiter, während du die Zutaten prüfst.',amount:'Ungefähre Beispielwerte',prep:'Vorbereiten',look:['Lege die Zutaten bereit, bevor du den Herd einschaltest.','Kleine Bläschen steigen gelegentlich auf. Die Sauce sollte nicht sprudelnd kochen.','Nutze die beschriebenen Garmerkmale im vollständigen Rezept.'],names:['Spaghetti','Gekochte Linsen','Gehackte Tomaten','Zwiebel','Karotte','Knoblauch','Olivenöl','Getrockneter Oregano','Salz','Schwarzer Pfeffer'],steps:[['Alles vorbereiten','Lies die Zubereitung und lege alle Zutaten bereit. Bereite das Gemüse vor und stelle alles in Reichweite.','Prüfe die benötigten Utensilien und die Reihenfolge der Arbeitsschritte, bevor du anfängst.'],['Sanft köcheln lassen','Reduziere die Hitze, bis kleine Bläschen die Oberfläche der Sauce durchbrechen. Rühre gelegentlich um.','Wenn die Sauce stark sprudelt, reduziere die Hitze etwas. Warte kurz, bis sich die Temperatur angepasst hat, bevor du erneut nachregelst.'],['Die Sauce prüfen','Rühre um und prüfe die Konsistenz, bevor du weitermachst. Orientiere dich an den Garmerkmalen des vollständigen Rezepts.','Der Timer erinnert dich daran, nach dem Essen zu sehen. Er zeigt nicht automatisch an, dass es fertig ist.']]}};
const t=k=>copy[state.language][k],btn=(label,action,primary=false,extra='')=>`<button class="button ${primary?'primary':''}" data-action="${action}" ${extra}>${label}</button>`;
function ingredientList(prefix){return `<ul class="ingredients">${t('names').map((name,i)=>{const factor=state.servings/2;const amounts=[200,240,400,1,1,2,1,1,null,null],units=state.language==='de'?['g','g','g','','','Zehen','EL','TL','','']:['g','g','g','','','cloves','tbsp','tsp','',''];const qty=amounts[i]===null?(state.language==='de'?'nach Geschmack':'to taste'):`${new Intl.NumberFormat(state.language,{maximumFractionDigits:1}).format(amounts[i]*factor)} ${units[i]}`;return `<li><label><input id="${prefix}-${i}" type="checkbox" data-ingredient="${i}" ${state.checks.has(i)?'checked':''}><span>${name}</span><span class="qty">${qty}</span></label></li>`;}).join('')}</ul>`;}
function timerText(){const secs=state.deadline?Math.max(0,Math.ceil((state.deadline-Date.now())/1000)):state.remaining;if(state.timerStarted&&secs===0)return t('done');if(!state.timerStarted)return t('timer');return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} · ${state.deadline?t('pause'):t('resume')}`;}
function updateTimer(){document.querySelectorAll('[data-action="timer"]').forEach(b=>{b.textContent=timerText();b.classList.toggle('done',state.timerStarted&&state.remaining===0&&!state.deadline);});}
function switchTab(tab,focus=false){if(tab===state.tab)return;state.positions[state.tab]=window.scrollY;state.tab=tab;applySections();window.scrollTo({top:state.positions[tab],behavior:'instant'});if(focus)$(`[data-tab="${tab}"]`).focus({preventScroll:true});}
function applySections(){if(state.screen!=='recipe'||state.scenario!=='ready')return;for(const tab of ['ingredients','method']){const panel=$(`#panel-${tab}`),button=$(`[data-tab="${tab}"]`);panel.hidden=!mq.matches&&state.tab!==tab;button.setAttribute('aria-selected',String(state.tab===tab));button.tabIndex=state.tab===tab?0:-1;if(mq.matches){panel.removeAttribute('role');panel.removeAttribute('aria-labelledby');}else{panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby',`tab-${tab}`);}}}
function render(){document.documentElement.lang=state.language;document.documentElement.dataset.theme=state.theme;$('#screen').value=state.screen;$('#language').value=state.language;$('#appearance').value=state.theme;$('#scenario').value=state.scenario;$('#switch-screen').textContent=state.screen==='recipe'?t('previewCook'):t('previewRecipe');$('#message').textContent='';
if(state.scenario!=='ready'){const k=state.scenario;app.innerHTML=`<main id="content" class="wrap notice"><p class="eyebrow">${t('short')}</p><h1 style="margin:18px 0">${t(k==='locked'?'locked':k)}</h1><p class="muted">${t(k==='locked'?'lockedHint':k==='loading'?'loadHint':'errorHint')}</p>${btn(t(k==='locked'?'unlock':k==='loading'?'simulate':'retry'),'ready',true)}<p class="footnote">${t('sample')}</p></main>`;return;}
if(state.screen==='recipe'){app.innerHTML=`<div class="hero wrap"><p class="eyebrow">${t('intro')}</p><h1>${t('title')}</h1><p class="meta">${t('basic')} · ${state.servings} ${t('servings')}</p><div class="version"><label for="version">${t('version')}</label><select id="version"><option value="basic">${t('basic')}</option><option value="advanced">${t('advanced')}</option></select></div></div><div class="sticky-tabs"><div class="wrap"><div class="sticky-context"><span>${t('short')}</span><span>${t('basic')}</span></div><div class="tabs" role="tablist" aria-label="${t('recipe')}">${['ingredients','method'].map(x=>`<button role="tab" id="tab-${x}" data-tab="${x}" aria-controls="panel-${x}">${t(x)}</button>`).join('')}</div></div></div><main id="content" class="wrap sections"><section class="section" id="panel-ingredients"><div class="section-head"><h2>${t('ingredients')}</h2><div class="servings">${btn('−','less',false,`aria-label="${state.language==='de'?'Weniger Portionen':'Fewer servings'}"`)}<span>${state.servings}</span>${btn('+','more',false,`aria-label="${state.language==='de'?'Mehr Portionen':'More servings'}"`)}</div></div>${ingredientList('recipe')}<p class="footnote">${t('sample')}</p><div class="note"><h3>${t('equipment')}</h3><p>${t('equipmentText')}</p></div></section><section class="section" id="panel-method"><h2>${t('method')}</h2><ol class="method">${t('steps').map(s=>`<li><div><h3>${s[0]}</h3><p>${s[1]}</p><p class="muted">${s[2]}</p></div></li>`).join('')}</ol><div class="note"><h3>${t('cue')}</h3><p>${t('look')[1]}</p></div><p class="footnote">${t('sample')}</p></section></main><footer class="actions"><div class="wrap">${btn(t('groceries'),'groceries')}${btn(t('cook'),'cook',true)}</div></footer>`;applySections();}
else if(state.step===3){app.innerHTML=`<main id="content" class="wrap notice"><h1>${t('completed')}</h1><p style="margin-top:20px">${t('completeHint')}</p>${btn(t('return'),'recipe',true)}</main>`;}
else{const step=t('steps')[state.step];app.innerHTML=`<div class="cookbar"><div class="wrap row"><button class="button quiet" data-action="recipe">← ${t('recipe')}</button>${btn(t('ingredients'),'ingredients')}</div></div><main id="content" class="wrap cook-layout"><aside class="wide-ingredients"><div class="section-head"><h2>${t('ingredients')}</h2><span class="small muted">${state.servings} ${t('servings')}</span></div>${ingredientList('wide')}</aside><section class="cookstep"><div class="progress" aria-label="${t('step')} ${state.step+1} ${t('of')} 3">${[0,1,2].map(i=>`<span class="${i<=state.step?'done':''}"></span>`).join('')}</div><p class="eyebrow">${t('short')} · ${t('step')} ${state.step+1} ${t('of')} 3</p><h1>${step[0]}</h1><p class="instruction">${step[1]}</p><button class="button timer" data-action="timer">${timerText()}</button><div class="note"><h3>${t('cue')}</h3><p>${t('look')[state.step]}</p></div><details class="help"><summary>${t('help')}</summary><p>${step[2]}</p></details><p class="footnote">${t('sample')}</p></section></main><footer class="actions"><div class="wrap">${btn(t('previous'),'previous',false,state.step===0?'disabled':'')}${btn(t(state.step===2?'finish':'next'),'next',true)}</div></footer>`;}}
function openIngredients(){const d=$('#ingredient-dialog');$('#dialog-title').textContent=t('ingredients');$('#close-dialog').textContent=t('close');$('#dialog-context').textContent=`${state.servings} ${t('servings')} · ${t('viewTimer')}`;$('#dialog-ingredients').innerHTML=ingredientList('dialog');updateTimer();d.showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){switchTab(b.dataset.tab,true);return;}const action=b.dataset.action;if(!action)return;
if(action==='timer'){if(state.deadline){state.remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));state.deadline=null;}else{if(state.remaining===0)state.remaining=300;state.timerStarted=true;state.deadline=Date.now()+state.remaining*1000;}updateTimer();return;}
if(action==='ingredients'){openIngredients();return;}if(action==='close-dialog'){$('#ingredient-dialog').close();return;}if(action==='groceries'){$('#message').textContent=t('saved');return;}if(action==='less'||action==='more'){state.servings=Math.max(1,state.servings+(action==='more'?1:-1));const y=scrollY;render();scrollTo(0,y);$(`[data-action="${action}"]`).focus({preventScroll:true});return;}
if(action==='cook'){state.screen='cook';state.step=1;}if(action==='recipe')state.screen='recipe';if(action==='ready')state.scenario='ready';if(action==='previous')state.step=Math.max(0,state.step-1);if(action==='next')state.step++;render();scrollTo(0,0);app.querySelector('h1')?.setAttribute('tabindex','-1');app.querySelector('h1')?.focus({preventScroll:true});});
document.addEventListener('keydown',e=>{const tab=e.target.dataset?.tab;if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();switchTab(e.key==='Home'?'ingredients':e.key==='End'?'method':tab==='ingredients'?'method':'ingredients',true);});
document.addEventListener('change',e=>{if(e.target.dataset.ingredient!==undefined){const id=Number(e.target.dataset.ingredient);if(e.target.checked)state.checks.add(id);else state.checks.delete(id);document.querySelectorAll(`[data-ingredient="${id}"]`).forEach(x=>x.checked=e.target.checked);return;}if(e.target.id==='version'){state.scenario=e.target.value==='advanced'?'locked':'ready';render();return;}const mapping={screen:'screen',language:'language',appearance:'theme',scenario:'scenario'};if(mapping[e.target.id]){state[mapping[e.target.id]]=e.target.value;render();}});
$('#switch-screen').addEventListener('click',()=>{state.screen=state.screen==='recipe'?'cook':'recipe';if(state.step===3)state.step=1;render();scrollTo(0,0);});
mq.addEventListener('change',()=>{const closedSheet=mq.matches&&$('#ingredient-dialog').open;if(closedSheet){$('#ingredient-dialog').close();}applySections();const focused=document.activeElement;if(closedSheet||focused?.closest('[hidden]')||focused?.matches('[role="tab"]')&&mq.matches){const target=app.querySelector(state.screen==='cook'?'h1':'h2');target?.setAttribute('tabindex','-1');target?.focus({preventScroll:true});}});
setInterval(()=>{if(state.deadline&&Date.now()>=state.deadline){state.remaining=0;state.deadline=null;$('#message').textContent=t('done');}updateTimer();},250);
render();
})();
</script>
</body>
</html>
